name = "teamcoco-shows-proxy"
main = "worker-shows.js"
compatibility_date = "2024-10-29"
compatibility_flags = ["nodejs_compat"]

[build]
command = ""

# Set TICKETMASTER_API_KEY via: wrangler secret put TICKETMASTER_API_KEY
# Get your API key from: https://developer.ticketmaster.com/products-and-docs/apis/discovery/
# Set ALLOWED_ORIGIN via: wrangler secret put ALLOWED_ORIGIN (e.g. https://your-domain.com)
[vars]
# TICKETMASTER_API_KEY = ""  # Set via secret
# ALLOWED_ORIGIN = ""  # Set via secret for CORS